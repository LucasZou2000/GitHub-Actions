# Fallback config B: minimal key set. Used only if config.makertbin.yaml
# fails schema validation, so a single CI run can tell a bad key apart from
# a bad march value. Mirrors the OE v1.2.8 example config exactly.
model_parameters:
  onnx_model: './models/nature_bpu_opset11.onnx'
  march: 'bayes-e'
  output_model_file_prefix: 'nature_bpu_synthcal'

input_parameters:
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  norm_type: 'no_preprocess'

calibration_parameters:
  cal_data_dir: './calib'
  cal_data_type: 'float32'

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
