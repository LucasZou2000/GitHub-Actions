# PTQ config for the Nature TCN graph on RDK X5 (bayes-e).
#
# The calibration set in ./calib is SYNTHETIC (see tools/make_calib.py) and the
# output prefix says so on purpose: nature_bpu_synthcal.
# A .bin built from this config is only good for measuring latency on the board.
# Do not treat its accuracy as meaningful and do not ship it.

model_parameters:
  onnx_model: './models/nature_bpu_opset11.onnx'
  march: 'bayes-e'
  working_dir: './build'
  output_model_file_prefix: 'nature_bpu_synthcal'
  layer_out_dump: False
  log_level: 'debug'

input_parameters:
  # Normalisation (mirror / center / scale) was moved out of the graph on purpose,
  # so the runtime input is already-normalised feature data, not an image.
  input_name: 'raw_history'
  input_type_rt: 'featuremap'
  input_type_train: 'featuremap'
  input_layout_train: 'NCHW'
  input_shape: '2x12x1x264'
  norm_type: 'no_preprocess'

calibration_parameters:
  cal_data_dir: './calib'
  cal_data_type: 'float32'
  calibration_type: 'default'
  cal_sample_num: 100

compiler_parameters:
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O3'
  jobs: 4
