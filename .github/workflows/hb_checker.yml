name: hb-checker

# Offline spike: does the Nature TCN graph compile onto the X5 BPU (march bayes-e)?
# This job only runs `hb_mapper checker` -- no calibration data, no board, no hardware.
# The checker reports which operators stay on the BPU and which fall back to the CPU.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'models/nature_bpu.onnx'
      - '.github/workflows/hb_checker.yml'

env:
  # OE v1.2.8 is the toolchain version for X5 / bayes-e. Offline tar (no registry login).
  OE_IMAGE_TAR: https://d-robotics-aitoolchain.oss-cn-beijing.aliyuncs.com/oe_x5/1.2.8/docker_openexplorer_ubuntu_20_x5_cpu_v1.2.8.tar.gz

jobs:
  checker:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write          # needed to push logs back to the `logs` branch
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # The stock image ships ~25 GB of SDKs we do not need; the OE image is large.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /

      # 1.7 GiB over the public internet; cache it so re-runs skip the download.
      - name: Cache OE image
        id: img-cache
        uses: actions/cache@v4
        with:
          path: oe_x5.tar.gz
          key: oe-x5-cpu-v1.2.8

      - name: Download OE X5 CPU image
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          wget -q --show-progress -O oe_x5.tar.gz "$OE_IMAGE_TAR"
          ls -lh oe_x5.tar.gz
          df -h /

      - name: Load image
        run: |
          docker load -i oe_x5.tar.gz
          docker images

      - name: hb_mapper checker
        id: checker
        continue-on-error: true
        run: |
          mkdir -p out
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -i x5 | head -n1)
          echo "using image: $IMAGE" | tee out/image.log
          set -o pipefail
          # tee on the host side: no flush race when the container exits.
          docker run --rm -v "$PWD:/work" -v "$PWD/out:/out" -w /work "$IMAGE" bash -lc '
            set +e
            echo "== hb_mapper --version =="
            hb_mapper --version
            echo
            echo "== hb_mapper checker --help =="
            hb_mapper checker --help
            echo
            echo "== model files =="
            ls -l /work/models

            run_case () {
              local tag="$1"; shift
              echo
              echo "########## CASE: $tag ##########"
              echo "cmd: hb_mapper $*"
              hb_mapper "$@"
              local rc=$?
              echo "---- CASE $tag exit=$rc ----"
              return $rc
            }

            # OE front-ends are picky about opset; try the highest first, then 11.
            run_case "opset17" checker --model-type onnx --march bayes-e \
              --model models/nature_bpu.onnx
            RC17=$?

            run_case "opset11" checker --model-type onnx --march bayes-e \
              --model models/nature_bpu_opset11.onnx
            RC11=$?

            # Static shapes should not need --input-shape, but pass it if both failed.
            if [ $RC17 -ne 0 ] && [ $RC11 -ne 0 ]; then
              run_case "opset11+inputshape" checker --model-type onnx --march bayes-e \
                --model models/nature_bpu_opset11.onnx \
                --input-shape raw_history 2x12x1x264
              RCIS=$?
            else
              RCIS=skipped
            fi

            echo
            echo "== SUMMARY: opset17=$RC17 opset11=$RC11 inputshape=$RCIS =="
            [ $RC17 -eq 0 ] || [ $RC11 -eq 0 ] || [ $RCIS -eq 0 ]
          ' 2>&1 | tee out/full_console.log

      - name: Summarise operator placement
        if: always()
        run: |
          {
            echo "## hb_mapper checker (bayes-e)"
            echo
            echo "model: \`models/nature_bpu.onnx\`  input: \`[2,12,1,264]\`  output: \`[2,80,1,16]\`"
            echo
            echo '```'
            if [ -s out/full_console.log ]; then
              grep -Ei 'CASE|exit=|conv|relu|slice|add|bpu|cpu|unsupport|not support|warn|error|total' out/full_console.log | head -n 160
            else
              echo "no log produced"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # hb_mapper writes its intermediates next to the model, not into out/.
      # The runner is destroyed afterwards, so collect them explicitly.
      - name: Collect build products
        if: always()
        run: |
          mkdir -p out
          cp -r .hb_check out/hb_check 2>/dev/null || echo "no .hb_check"
          cp -v hb_mapper_checker*.log out/ 2>/dev/null || true
          cp -v *.bin out/ 2>/dev/null || true
          cp -v *_quant_info.json out/ 2>/dev/null || true
          echo "--- collected ---"
          find out -type f | sort | while read -r f; do echo "$(du -h "$f" | cut -f1)  $f"; done

      # The log is the whole deliverable of this spike; publish it to a branch so it
      # can be read without downloading artifacts.
      - name: Publish logs to `logs` branch
        if: always()
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/logpub" && cd "$RUNNER_TEMP/logpub"
          git init -q -b logs
          cp -r "$GITHUB_WORKSPACE/out/." . || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "checker logs: run ${GITHUB_RUN_ID}" || echo "nothing to publish"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hb-checker-logs
          path: out/
          if-no-files-found: warn
